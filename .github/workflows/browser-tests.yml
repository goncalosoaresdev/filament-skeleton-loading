name: Browser tests

on:
  pull_request:
  push:
    branches: ['*.x']

permissions:
  contents: read

concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    uses: mortalkiller/filament-package-template/.github/workflows/reusable-browser-tests.yml@50aa14ee7a84caf7a0065a5937d5fd98c5298600
    with:
      filament-matrix-json: >-
        {"include":[{"filament":"4.12.6","compatibility_advisory":"PKSA-cnr1-6g7k-bp3d"},{"filament":"^5.8.1"}]}
