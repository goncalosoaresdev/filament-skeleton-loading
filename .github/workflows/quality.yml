name: Code quality

on:
  pull_request:
  push:
    branches: ['*.x']

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: mortalkiller/filament-package-template/.github/workflows/reusable-quality.yml@db391cee470edc945779f419e909eea9283f1193
    with:
      php-version: '8.4'
      static-analysis: true
